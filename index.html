<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Blog tarara</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #f4f4f9;
    }

    header {
      background-color: #338d51;
      color: #FFFFFF;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    main {
      background-color: #FFFFFF;
      color: #1c441c;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    article {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    article img {
      max-width: 100%;
      height: auto;
    }

    .artigo-autor {
      font-style: italic;
      color: #555;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid #0c6418;
      background-color: #fff;
      border-radius: 4px;
      margin-right: 8px;
    }

    button.curtido {
      border-color: #cf1010;
      background-color: #ffe6e6;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu blog tarara</h1>
    <p>Vou compartilhar conhecimentos sobre alguma coisa tarara </p>
  </header>

  <main>
    <article>
      <img src="imagem-blog.png" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante.">
      <div>
        <h2>Meu primeiro post</h2>
        <p class="artigo-autor">Por: felipi tararara</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de alguma coisa tarara.</p>
        <button class="btn-curtir">❤️ <span>0</span></button>
        <button class="btn-curtir">👍 <span>0</span></button>
      </div>
    </article>

    <article>
      <img src="imagem-blog.png" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante.">
      <div>
        <h2>Meu segundo post</h2>
        <p class="artigo-autor">Por: felipi athur  tarara</p>
        <p>Continuando nossos estudos sobre tararara web!</p>
        <button class="btn-curtir">❤️ <span>0</span></button>
        <button class="btn-curtir">👍 <span>0</span></button>
      </div>
    </article>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao) {
      botao.addEventListener("click", botaoClicado);
    });

    function botaoClicado(event) {
      const botao = event.currentTarget;
      const texto = botao.querySelector("span");
      let contador = parseInt(texto.textContent);

      // Verifica se o botão específico já foi clicado
      const curtiu = botao.dataset.curtiu === "true";

      if (!curtiu) {
        contador++;
        botao.dataset.curtiu = "true";
        botao.classList.add("curtido");
      } else {
        contador--;
        botao.dataset.curtiu = "false";
        botao.classList.remove("curtido");
      }

      texto.textContent = contador;
    }
  </script>

</body>
</html>
